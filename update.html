<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新 SC 程序</title>
<style>:root{font:15px Arial,'Microsoft YaHei',sans-serif;color:#202329;background:#f6f7f8}main{max-width:440px;margin:10vh auto;padding:24px;background:white;border:1px solid #e4e6e8;border-radius:16px}h1{font-size:22px}p{line-height:1.8}button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#947746;color:white}a{color:#806233}#status{white-space:pre-wrap}</style>
<main><h1>更新程序，保留原数据</h1><p>当前版本：2026.11.24 · 首页入口调整：游戏保留在业务面板，检查更新移至日期下方。</p><p>请先等待正在进行的 AI 回复结束，关闭其他 SC 标签页。此操作仅刷新本站程序离线缓存，不读取或清空聊天、图片、角色、设置和游戏存档。</p><button id="update">更新并返回 SC</button><p id="status" role="status" aria-live="polite"></p><a href="./">返回 SC</a></main>
<script>
document.getElementById('update').onclick=async()=>{
 const button=document.getElementById('update'),status=document.getElementById('status');button.disabled=true;status.textContent='正在检查更新…';
 try{
  const response=await fetch('sw.js?release=20261124',{cache:'no-store'});if(!response.ok||!(await response.text()).includes('sc-terminal-static-'))throw Error('未能取得程序文件，请联网后重试。');
  const base=new URL('./',location.href);
  if('serviceWorker' in navigator){for(const reg of await navigator.serviceWorker.getRegistrations())if(reg.scope===base.href)await reg.unregister();}
  if('caches' in window){for(const name of await caches.keys())if(name.startsWith('sc-terminal-static-'))await caches.delete(name);}
  status.textContent='程序缓存已刷新，正在返回。原数据未改动。';location.replace('./?release=20261124');
 }catch(e){status.textContent='更新未完成：'+e.message+' 原数据未改动，可重试。';button.disabled=false;}
};
</script></html>
