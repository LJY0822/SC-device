<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SC 游戏</title><link rel="stylesheet" href="../shared/ui.css"></head><body>
<header class="game-toolbar"><button id="back" aria-label="返回游戏目录">‹ 返回</button><span id="game-title"></span><button id="theme" aria-label="切换深浅色模式">☾</button><button id="settings" aria-label="游戏设置">设置</button></header>
<main><section class="match-heading"><div><h1 id="match-title"></h1><p id="match-status" role="status" aria-live="polite"></p></div><img id="game-sticker" class="game-sticker" alt="" decoding="async"><span id="elapsed"></span></section><div id="alert" role="alert" hidden></div><div id="play"></div><div class="game-controls"><button id="pause">暂停</button><button id="new">新对局</button><button id="scene">场景卡</button><button id="messages">桌边记录</button></div><section id="ending" class="card" hidden></section><section class="card dialogue"><header><h2>桌边记录</h2><button id="history">历史战绩</button></header><ol id="log" aria-live="polite"></ol><form id="reply"><input id="reply-text" maxlength="300" aria-label="对角色说话" placeholder="对角色说句话…"><button>发送</button></form></section></main>
<button id="toast" hidden></button><dialog id="preview"><form method="dialog"><div class="dialog-head"><h2>开局预览</h2><button value="cancel" aria-label="取消预览">×</button></div></form><div id="preview-content"></div><div class="dialog-actions"><button id="generate">生成角色开局</button><button id="skip-generation">停止生成</button><button id="confirm" class="primary">确认并开始</button></div><p id="generation-status" role="status"></p></dialog>
<dialog id="options"><div class="dialog-head"><h2>游戏设置</h2><button id="options-close">×</button></div><div id="options-content"></div></dialog>
<script src="../shared/random.js"></script><script src="../naval/engine.js"></script><script src="../holdem/engine.js"></script><script src="../gomoku/engine.js"></script><script src="../mastermind/engine.js"></script><script src="../miner/engine.js"></script><script src="../shared/framework.js"></script><script src="ui.js"></script></body></html>
